name: Build IceClean

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  APP_VERSION: 1.0.0

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 22d9c655dc24ad24c6cac27607005e619ce46740

    - name: Configure CMake
      run: |
        cmake -B ${{ github.workspace }}/build `
              -S ${{ github.workspace }} `
              -G "Visual Studio 17 2022" `
              -A x64 `
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
              -DVCPKG_TARGET_TRIPLET=x64-windows-static `
              -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel 2>&1 | Tee-Object -FilePath ${{ github.workspace }}/build_log.txt
        $exit = $LASTEXITCODE
        if ($exit -ne 0) {
          Write-Output "===== BUILD FAILED. Last 80 lines: ====="
          Get-Content ${{ github.workspace }}/build_log.txt -Tail 80 | ForEach-Object {
            if ($_ -match 'error|LNK|fatal|unresolved') { Write-Output "::error::$($_.Substring(0, [Math]::Min($_.Length, 300)))" }
          }
          Write-Output "===== END ====="
        }
        exit $exit

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: ${{ github.workspace }}/build_log.txt

    - name: Install NSIS
      uses: crazy-max/ghaction-chocolatey@v2
      with:
        args: install nsis

    - name: Build Installer
      run: |
        # Copy build artifacts to scripts directory for NSIS
        Copy-Item build\${{ env.BUILD_TYPE }}\IceClean.exe scripts\IceClean.exe
        Copy-Item src\gui\resources\app.manifest scripts\app.manifest
        Copy-Item src\gui\resources\QrReward.jpg scripts\QrReward.jpg
        Copy-Item src\gui\resources\XiTu-logo.jpg scripts\XiTu-logo.jpg
        
        cd scripts
        makensis -DVERSION=${{ env.APP_VERSION }} installer.nsi 2>&1 | Tee-Object -FilePath ../installer_log.txt
        $exit = $LASTEXITCODE
        if ($exit -ne 0) {
          Write-Output "===== INSTALLER BUILD FAILED. Last 80 lines: ====="
          Get-Content ../installer_log.txt -Tail 80 | ForEach-Object {
            if ($_ -match 'error|Error|fatal|unresolved') { Write-Output "::error::$($_.Substring(0, [Math]::Min($_.Length, 300)))" }
          }
          Write-Output "===== END ====="
        }
        cd ..
        exit $exit

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: IceClean-${{ env.BUILD_TYPE }}
        path: |
          ${{ github.workspace }}/build/${{ env.BUILD_TYPE }}/IceClean.exe
          ${{ github.workspace }}/IceClean-${{ env.APP_VERSION }}-setup.exe
        if-no-files-found: warn

name: Release IceClean

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  APP_VERSION: 1.0.0

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 22d9c655dc24ad24c6cac27607005e619ce46740

    - name: Install NSIS
      uses: crazy-max/ghaction-chocolatey@v2
      with:
        args: install nsis

    - name: Configure CMake
      run: |
        cmake -B ${{ github.workspace }}/build `
              -S ${{ github.workspace }} `
              -G "Visual Studio 17 2022" `
              -A x64 `
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
              -DVCPKG_TARGET_TRIPLET=x64-windows-static `
              -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Build Installer
      run: |
        # Copy build artifacts to scripts directory for NSIS
        Write-Output "=== Copying files ==="
        $srcExe = "build\${{ env.BUILD_TYPE }}\IceClean.exe"
        $srcManifest = "src\gui\resources\app.manifest"
        $srcQr = "src\gui\resources\QrReward.jpg"
        $srcLogo = "src\gui\resources\XiTu-logo.jpg"
        
        Write-Output "Source exe exists: $(Test-Path $srcExe)"
        Write-Output "Source manifest exists: $(Test-Path $srcManifest)"
        Write-Output "Source QR exists: $(Test-Path $srcQr)"
        Write-Output "Source Logo exists: $(Test-Path $srcLogo)"
        
        Copy-Item $srcExe scripts\IceClean.exe
        Copy-Item $srcManifest scripts\app.manifest
        Copy-Item $srcQr scripts\QrReward.jpg
        Copy-Item $srcLogo scripts\XiTu-logo.jpg
        
        Write-Output "=== Files in scripts dir ==="
        Get-ChildItem scripts
        
        # Run makensis from root with explicit script path
        makensis -V4 -DVERSION=${{ env.APP_VERSION }} scripts/installer.nsi 2>&1 | Tee-Object -FilePath installer_log.txt
        $exit = $LASTEXITCODE
        if ($exit -ne 0) {
          Write-Output "===== INSTALLER BUILD FAILED. Full log: ====="
          Get-Content installer_log.txt | ForEach-Object {
            if ($_ -match 'error|Error|fatal|unresolved|!error|!warning') { Write-Output "::error::$($_.Substring(0, [Math]::Min($_.Length, 300)))" } else { Write-Output $_ }
          }
          Write-Output "===== END ====="
        }
        exit $exit

    - name: Get version from tag
      id: get_version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=v1.0.0-dev" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        name: IceClean ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## IceClean ${{ steps.get_version.outputs.VERSION }}

          智能C盘清理与迁移工具

          ### 功能特性
          - 12类扫描器 + 7类清理器 + 6类迁移器
          - 一键扫描/清理，扫描结果直接在首页显示
          - 智能迁移（Junction链接技术）
          - 启动加速（启动项/服务/计划任务/进程管理）
          - 大文件分析（矩形树图可视化）
          - 三级安全标识 + 50+白名单路径保护
          - 自动创建系统还原点

          ### 使用说明
          1. 下载 `IceClean.exe`
          2. 右键 → 以管理员身份运行
          3. 点击"一键扫描"开始使用

          ### 系统要求
          - Windows 10/11 (64位)
          - 建议以管理员权限运行以获得完整功能
        draft: false
        prerelease: false
        files: |
          ${{ github.workspace }}/build/${{ env.BUILD_TYPE }}/IceClean.exe
          ${{ github.workspace }}/IceClean-${{ env.APP_VERSION }}-setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
